name: Ramen API checks
on:
  push:
    branches: [main, 'maintenance/ramen-*']
    paths: ['**.py', 'templates/**', 'static/css/prawn.css', 'requirements*', 'index.html', 'documentation.html', 'Procfile', 'run.gunicorn.sh', '.python-version', 'runtime.txt', '.github/workflows/ramen-checks.yml']
  pull_request:
    paths: ['**.py', 'templates/**', 'static/css/prawn.css', 'requirements*', 'index.html', 'documentation.html', 'Procfile', 'run.gunicorn.sh', '.python-version', 'runtime.txt', '.github/workflows/ramen-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ramen-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest -v test_ramen
      - run: python render_docs.py --check
      - run: gunicorn --check-config main:app
      - run: python ci_smoke.py
